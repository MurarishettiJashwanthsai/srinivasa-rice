version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Version 1 removes icon aliases currently used by the production UI.
      - dependency-name: lucide-react
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # React Native is pinned by the installed Expo SDK and must be upgraded with Expo.
      - dependency-name: react-native

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
