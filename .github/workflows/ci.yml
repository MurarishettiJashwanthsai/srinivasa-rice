name: Application checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pip-audit
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install website dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Lint website
        working-directory: frontend
        run: npm run lint
      - name: Build and pre-render website
        working-directory: frontend
        env:
          ALLOW_STATIC_PRODUCT_FALLBACK: 'true'
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Type-check mobile app
        working-directory: mobile
        run: npm run typecheck
      - name: Validate Expo configuration
        working-directory: mobile
        run: npx expo-doctor@latest
